[project]
name = "gtzan-probe"
version = "0.1.0"
description = "XAI for Music Genre Classification on GTZAN Dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "librosa",
    "soundfile",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-image",
    "tqdm",
    "torch",
    "torchvision",
    "shap",
    "lime",
    "transformers",
    "scipy",
    "kaggle",
]

[project.scripts]
prepare-dataset = "gtzan_probe.prepare_dataset:main"
train = "gtzan_probe.train:main"
evaluate = "gtzan_probe.evaluate:main"
explain-shap = "gtzan_probe.explain_shap:main"
explain-lime = "gtzan_probe.explain_lime:main"
validate = "gtzan_probe.validate:main"
explain-attention = "gtzan_probe.explain_attention:main"
generate-figures = "gtzan_probe.generate_figures:main"
interventional-validate = "gtzan_probe.interventional_validation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtzan_probe"]
